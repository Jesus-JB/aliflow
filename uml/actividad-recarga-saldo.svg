<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="964px" preserveAspectRatio="none" style="width:961px;height:964px;background:#FFFFFF;" version="1.1" viewBox="0 0 961 964" width="961px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><g class="title" data-source-line="2"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="242.6348" x="358.5337" y="33.5352">Actividad &#8212; Recargar saldo (UC2)</text></g><rect fill="none" height="21.1992" style="stroke:none;stroke-width:1;" width="914.7021" x="20" y="54.7852"/><ellipse cx="175.6904" cy="90.9844" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="204.1895" x="73.5957" y="120.9844"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="184.1895" x="83.5957" y="142.5859">Elige el establecimiento destino</text><rect fill="#F1F1F1" height="48.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="179.1816" x="86.0996" y="175.1172"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="159.1816" x="96.0996" y="196.7188">Selecciona "Recargar saldo"</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="108.8496" x="96.0996" y="210.8516">e ingresa el monto</text><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="142.2734" x="104.5537" y="428.3916"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="122.2734" x="114.5537" y="449.9932">Ver mensaje de error</text><ellipse cx="175.6904" cy="493.5244" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="175.6904" cy="493.5244" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="48.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="128.9492" x="111.2158" y="546.5244"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="108.9492" x="121.2158" y="568.126">Registrar Pago con</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="107.9531" x="121.2158" y="582.2588">estado APROBADO</text><rect fill="#F1F1F1" height="48.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="299.3809" x="26" y="614.79"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="279.3809" x="36" y="636.3916">Acreditar SaldoEstablecimiento del local destino</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="115.1133" x="36" y="650.5244">(operaci&#243;n at&#243;mica)</text><rect fill="#F1F1F1" height="48.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="195.3125" x="78.0342" y="683.0557"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="175.3125" x="88.0342" y="704.6572">Generar ComprobanteRecarga</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="127.3125" x="88.0342" y="718.79">(sin validez tributaria)</text><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="144.875" x="103.2529" y="751.3213"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="124.875" x="113.2529" y="772.9229">Ver saldo actualizado</text><path d="M206.6904,795.4541 L206.6904,865.3516 L186.6904,869.3516 L206.6904,873.3516 L206.6904,943.249 A0,0 0 0 0 206.6904,943.249 L560.1426,943.249 A0,0 0 0 0 560.1426,943.249 L560.1426,805.4541 L550.1426,795.4541 L206.6904,795.4541 A0,0 0 0 0 206.6904,795.4541" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M550.1426,795.4541 L550.1426,805.4541 L560.1426,805.4541 L550.1426,795.4541" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="244.7148" x="212.6904" y="813.0225">Decisi&#243;n de Negocios (8-ago-2026):</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="80.0376" x="461.5186" y="813.0225">la recarga es</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="133.1548" x="212.6904" y="828.333">por establecimiento</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="179.8989" x="345.8452" y="828.333">. Toda recarga tiene un local</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="297.3306" x="212.6904" y="843.6436">destino obligatorio y el saldo solo se gasta ah&#237;.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="317.5859" x="212.6904" y="858.9541">El dinero va de la pasarela **directo a la cuenta de</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="332.4521" x="212.6904" y="874.2646">ese proveedor**: Aliflow registra el movimiento pero</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="257.5435" x="212.6904" y="889.5752">no custodia fondos en ning&#250;n momento.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="212.6904" y="904.8857">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="315.9927" x="212.6904" y="920.1963">Revierte la decisi&#243;n #4 del 28-jul, que defin&#237;a una</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="302.4087" x="212.6904" y="935.5068">bolsa &#250;nica con distribuci&#243;n interna al comprar.</text><ellipse cx="175.6904" cy="869.3516" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="175.6904" cy="869.3516" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1.5;" x1="20" x2="20" y1="54.7852" y2="943.249"/><rect fill="#F1F1F1" height="48.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="183.5879" x="571.1426" y="243.3828"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="91.2715" x="581.1426" y="264.9844">Procesa el pago</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="163.5879" x="581.1426" y="279.1172">(Kushki / PayPhone / Stripe)</text><line style="stroke:#000000;stroke-width:1.5;" x1="565.1426" x2="565.1426" y1="54.7852" y2="943.249"/><rect fill="#F1F1F1" height="48.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="135.9746" x="764.7305" y="360.126"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="108.9492" x="774.7305" y="381.7275">Registrar Pago con</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="115.9746" x="774.7305" y="395.8604">estado RECHAZADO</text><polygon fill="#F1F1F1" points="787.9846,311.6484,877.4509,311.6484,889.4509,323.6484,877.4509,335.6484,787.9846,335.6484,775.9846,323.6484,787.9846,311.6484" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.5835" x="836.7178" y="346.2832">no</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="89.4663" x="787.9846" y="327.8057">&#191;Pago aprobado?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="8.7871" x="889.4509" y="321.3281">s&#237;</text><line style="stroke:#000000;stroke-width:1.5;" x1="758.7305" x2="758.7305" y1="54.7852" y2="943.249"/><line style="stroke:#000000;stroke-width:1.5;" x1="932.8545" x2="932.8545" y1="54.7852" y2="943.249"/><line style="stroke:#181818;stroke-width:1;" x1="175.6904" x2="175.6904" y1="100.9844" y2="120.9844"/><polygon fill="#181818" points="171.6904,110.9844,175.6904,120.9844,179.6904,110.9844,175.6904,114.9844" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="175.6904" x2="175.6904" y1="155.1172" y2="175.1172"/><polygon fill="#181818" points="171.6904,165.1172,175.6904,175.1172,179.6904,165.1172,175.6904,169.1172" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="175.6904" x2="175.6904" y1="462.5244" y2="482.5244"/><polygon fill="#181818" points="171.6904,472.5244,175.6904,482.5244,179.6904,472.5244,175.6904,476.5244" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="175.6904" x2="175.6904" y1="594.79" y2="614.79"/><polygon fill="#181818" points="171.6904,604.79,175.6904,614.79,179.6904,604.79,175.6904,608.79" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="175.6904" x2="175.6904" y1="663.0557" y2="683.0557"/><polygon fill="#181818" points="171.6904,673.0557,175.6904,683.0557,179.6904,673.0557,175.6904,677.0557" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="175.6904" x2="175.6904" y1="731.3213" y2="751.3213"/><polygon fill="#181818" poi