.5" ry="12.5"/><text x="36" y="580.255" fill="#000" font-size="12" textLength="239.52">Acreditar TarjetaVirtual.saldoDisponible</text><text x="36" y="594.224" fill="#000" font-size="12" textLength="196.898">(bolsa única, operación atómica)</text><rect x="53.636" y="627.054" width="204.248" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="63.636" y="648.192" fill="#000" font-size="12" textLength="184.248">Generar ComprobanteRecarga</text><text x="63.636" y="662.161" fill="#000" font-size="12" textLength="132.48">(sin validez tributaria)</text><rect x="81.286" y="694.991" width="148.947" height="33.969" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="91.286" y="716.13" fill="#000" font-size="12" textLength="128.947">Ver saldo actualizado</text><path d="M186.76,738.96 L186.76,785.358 L166.76,789.358 L186.76,793.358 L186.76,839.757 A0,0 0 0 0 186.76,839.757 L557.833,839.757 A0,0 0 0 0 557.833,839.757 L557.833,748.96 L547.833,738.96 L186.76,738.96 A0,0 0 0 0 186.76,738.96" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M547.833,738.96 L547.833,748.96 L557.833,748.96 L547.833,738.96" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="192.76" y="756.027" fill="#000" font-size="13" textLength="260.927" font-weight="700">Decisión de Negocios (28-jul-2026):</text><text x="457.819" y="756.027" fill="#000" font-size="13" textLength="85.014">el estudiante</text><text x="192.76" y="771.16" fill="#000" font-size="13" textLength="31.351">hace</text><text x="228.243" y="771.16" fill="#000" font-size="13" textLength="122.427" font-weight="700">una sola recarga</text><text x="354.803" y="771.16" fill="#000" font-size="13" textLength="178.75">a una bolsa única, gastable</text><text x="192.76" y="786.292" fill="#000" font-size="13" textLength="331.329">en cualquier local. Ya no se reparte el monto entre</text><text x="192.76" y="801.425" fill="#000" font-size="13" textLength="332.744">proveedores en este paso — la distribución interna</text><text x="192.76" y="816.558" fill="#000" font-size="13" textLength="255.734">hacia cada local ocurre al comprar (ver</text><text x="192.76" y="831.691" fill="#000" font-size="13" textLength="225.012">actividad-compra-almuerzo.puml).</text><ellipse cx="155.76" cy="789.358" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="155.76" cy="789.358" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="20" y1="55.042" x2="20" y2="839.757" style="stroke:#000;stroke-width:1.5;"/><rect x="568.833" y="188.933" width="186.775" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="578.833" y="210.071" fill="#000" font-size="12" textLength="95.373">Procesa el pago</text><text x="578.833" y="224.04" fill="#000" font-size="12" textLength="166.775">(Kushki / PayPhone / Stripe)</text><line x1="562.833" y1="55.042" x2="562.833" y2="839.757" style="stroke:#000;stroke-width:1.5;"/><rect x="765.608" y="305.272" width="141.113" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="775.608" y="326.411" fill="#000" font-size="12" textLength="113.572">Registrar Pago con</text><text x="775.608" y="340.38" fill="#000" font-size="12" textLength="121.113">estado RECHAZADO</text><polygon points="788.83,256.87,883.5,256.87,895.5,268.87,883.5,280.87,788.83,280.87,776.83,268.87,788.83,256.87" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="840.165" y="291.081" fill="#000" font-size="11" textLength="13.702">no</text><text x="788.83" y="272.678" fill="#000" font-size="11" textLength="94.671">¿Pago aprobado?</text><text x="895.5" y="266.276" fill="#000" font-size="11" textLength="8.787">sí</text><line x1="759.608" y1="55.042" x2="759.608" y2="839.757" style="stroke:#000;stroke-width:1.5;"/><line x1="938.912" y1="55.042" x2="9