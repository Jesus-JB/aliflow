, que sí</text><text x="12" y="425.565" fill="#000" font-size="13" textLength="290.012">tiene API REST documentada — el evento se</text><text x="12" y="440.698" fill="#000" font-size="13" textLength="168.994">procesa al primer intento.</text></g><g class="entity" data-qualified-name="GMN27" id="ent0028" data-source-line="75"><path d="M1727.09,347.97 L1727.09,463.9 A0,0 0 0 0 1727.09,463.9 L2075.927,463.9 A0,0 0 0 0 2075.927,463.9 L2075.927,357.97 L2065.927,347.97 L1862,347.97 L1799.87,271.42 L1854,347.97 L1727.09,347.97 A0,0 0 0 0 1727.09,347.97" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M2065.927,347.97 L2065.927,357.97 L2075.927,357.97 L2065.927,347.97" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="1733.09" y="365.037" fill="#000" font-size="13" textLength="284.153">El mismo core, el mismo worker y la misma</text><text x="1733.09" y="380.17" fill="#000" font-size="13" textLength="248.168">interfaz, contra un ERP sin API pública</text><text x="1733.09" y="395.303" fill="#000" font-size="13" textLength="277.57">(Caramel Coffee / Alpwin): el evento agota</text><text x="1733.09" y="410.435" fill="#000" font-size="13" textLength="293.414">3 reintentos y queda FALLIDO — visible en el</text><text x="1733.09" y="425.568" fill="#000" font-size="13" textLength="307.772">panel del proveedor (UC10) para reconciliación</text><text x="1733.09" y="440.701" fill="#000" font-size="13" textLength="254.877">manual, en vez de perder la venta. Ver</text><text x="1733.09" y="455.834" fill="#000" font-size="13" textLength="327.837">Hallazgos-Ingenieria-API-Generica.md sección 4.3.</text></g><!--reverse link baru to integBaru--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk11" data-source-line="51" data-link-type="composition"><path d="M516.036,94.572 C521.966,103.822 520.97,103.92 524.51,114.19 C554.32,200.83 552.97,310.3 549.62,367" style="stroke:#181818;stroke-width:1;" fill="none" id="baru-backto-integBaru" codeLine