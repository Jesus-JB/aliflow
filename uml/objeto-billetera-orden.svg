,577.107 L385.215,577.107 A0,0 0 0 0 385.215,577.107 L385.215,486.31 L375.215,476.31 L254.04,476.31 L250.04,379.88 L246.04,476.31 L114.86,476.31 A0,0 0 0 0 114.86,476.31" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M375.215,476.31 L375.215,486.31 L385.215,486.31 L375.215,476.31" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="120.86" y="493.377" fill="#000" font-size="13" textLength="209.758">Ilustra la decisión de negocio ya</text><text x="120.86" y="508.51" fill="#000" font-size="13" textLength="249.355">confirmada: el saldo es independiente</text><text x="120.86" y="523.643" fill="#000" font-size="13" textLength="235.955">por proveedor (no una sola bolsa de</text><text x="120.86" y="538.775" fill="#000" font-size="13" textLength="194.638">dinero). Ana podría tener otro</text><text x="120.86" y="553.908" fill="#000" font-size="13" textLength="213.135">SaldoProveedor distinto con otro</text><text x="120.86" y="569.041" fill="#000" font-size="13" textLength="128">proveedor, en cero.</text></g><g class="entity" data-qualified-name="GMN20" id="ent0021" data-source-line="66"><path d="M1024.77,299.38 L1024.77,299.38 L865.18,238.84 L1024.77,307.38 L1024.77,415.31 A0,0 0 0 0 1024.77,415.31 L1299.321,415.31 A0,0 0 0 0 1299.321,415.31 L1299.321,309.38 L1289.321,299.38 L1024.77,299.38 A0,0 0 0 0 1024.77,299.38" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1289.321,299.38 L1289.321,309.38 L1299.321,309.38 L1289.321,299.38" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="1030.77" y="316.447" fill="#000" font-size="13" textLength="211.713">El estudiante ya compró (estado</text><text x="1030.77" y="331.58" fill="#000" font-size="13" textLength="249.126">COMPRADO), tiene su código de retiro</text><text x="1030.77" y="346.713" fill="#000" font-size="13" textLength="217.902">vigente (usado=false). Cuando el</text><text x="1030.77" y="361.845" fill="#000" font-size="13" textLength="203.411">Cajero lo valide, orden1.estado</text><text x="1030.77" y="376.978" fill="#000" font-size="13" textLength="253.551">pasará a ENTREGADO y codigo1.usado</text><text x="1030.77" y="392.111" fill="#000" font-size="13" textLength="214.633">a true (ver diagrama de estados,</text><text x="1030.77" y="407.244" fill="#000" font-size="13" textLength="149.779">entregable pendiente).</text></g><!--reverse link ana to tv1--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk9" data-source-line="47" data-link-type="composition"><path d="M561.083,94.182 C538.993,123.402 516.51,153.17 498.34,177.21" style="stroke:#181818;stroke-width:1;" fill="none" id="ana-backto-tv1" codeLine="47"/><polygon points="568.32,84.61,561.511,86.984,561.083,94.182,567.892,91.808,568.32,84.61" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--reverse link tv1 to sp1--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" id="lnk10" data-source-line="48" data-link-type="composition"><path d="M439.813,229.093 C395.613,258.733 326.65,304.97 282.4,334.64" style="stroke:#181818;stroke-width:1;" fill="none" id="tv1-backto-sp1" codeLine="48"/><polygon points="449.78,222.41,442.569,222.43,439.813,229.093,447.025,229.074,449.78,222.41" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link sp1 to baru--><g class="link" data-entity-1="ent0005" data-entity-2="ent0001" id="lnk11" data-source-line="49" data-link-type="dependency"><path d="M168.28,378.93 C118.6,396.13 59.13,426.14 29.04,476.31 C6,514.72 10.45,536.34 29.04,577.1 C43.33,608.44 66.873,631.557 93.133,650.877" style="stroke:#181818;stroke-width:1;" fill="none" id="sp1-to-baru" codeLine="49"/><polygon points="97.16,653.84,92.281,645.285,93.133,650.877,87.54,651.728,97.16,653.84" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="30.04" y="531.267" fill="#000" font-size="13" t