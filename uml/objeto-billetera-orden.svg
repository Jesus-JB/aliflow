0 167.46,699.037 L437.815,699.037 A0,0 0 0 0 437.815,699.037 L437.815,608.24 L427.815,598.24 L306.64,598.24 L302.64,432.7 L298.64,598.24 L167.46,598.24 A0,0 0 0 0 167.46,598.24" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M427.815,598.24 L427.815,608.24 L437.815,608.24 L427.815,598.24" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="173.46" y="615.307" fill="#000" font-size="13" textLength="209.758">Ilustra la decisión de negocio ya</text><text x="173.46" y="630.44" fill="#000" font-size="13" textLength="249.355">confirmada: el saldo es independiente</text><text x="173.46" y="645.573" fill="#000" font-size="13" textLength="235.955">por proveedor (no una sola bolsa de</text><text x="173.46" y="660.705" fill="#000" font-size="13" textLength="194.638">dinero). Ana podría tener otro</text><text x="173.46" y="675.838" fill="#000" font-size="13" textLength="213.135">SaldoProveedor distinto con otro</text><text x="173.46" y="690.971" fill="#000" font-size="13" textLength="128">proveedor, en cero.</text></g><g class="entity" data-qualified-name="GMN21" id="ent0022" data-source-line="67"><path d="M1149.36,299.38 L1149.36,521.239 L1423.911,521.239 L1423.911,309.38 L1413.911,299.38 L1149.36,299.38" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1413.911,299.38 L1413.911,309.38 L1423.911,309.38 L1413.911,299.38" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="1155.36" y="316.447" fill="#000" font-size="13" textLength="211.713">El estudiante ya compró (estado</text><text x="1155.36" y="331.58" fill="#000" font-size="13" textLength="249.126">COMPRADO), tiene su código de retiro</text><text x="1155.36" y="346.713" fill="#000" font-size="13" textLength="217.902">vigente (usado=false). Cuando el</text><text x="1155.36" y="361.845" fill="#000" font-size="13" textLength="203.411">Cajero lo valide, orden1.estado</text><text x="1155.36" y="376.978" fill="#000" font-size="13" textLength="253.551">pasará a ENTREGADO y codigo1.usado</text><text x="1155.36" y="392.111" fill="#000" font-size="13" textLength="214.633">a true (ver diagrama de estados,</text><text x="1155.36" y="407.244" fill="#000" font-size="13" textLength="149.779">entregable pendiente).</text><text x="1155.36" y="422.377" fill="#000" font-size="13"> </text><text x="1155.36" y="437.509" fill="#000" font-size="13" textLength="234.508">orden1.proveedor = baru, igual que</text><text x="1155.36" y="452.642" fill="#000" font-size="13" textLength="230.744">det1.plato1.proveedor — cumple el</text><text x="1155.36" y="467.775" fill="#000" font-size="13" textLength="226.23">invariante agregado el 27-jul-2026</text><text x="1155.36" y="482.908" fill="#000" font-size="13" textLength="239.129">en diagrama-clases.puml: una orden</text><text x="1155.36" y="498.041" fill="#000" font-size="13" textLength="240.037">nunca mezcla platos de proveedores</text><text x="1155.36" y="513.173" fill="#000" font-size="13" textLength="59.541">distintos.</text></g><!--reverse link ana to tv1--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk9" data-source-line="47" data-link-type="composition"><path d="M450.685,94.184 C428.595,123.414 406.11,153.17 387.94,177.21" style="stroke:#181818;stroke-width:1;" fill="none" id="ana-backto-tv1" codeLine="47"/><polygon points="457.92,84.61,451.111,86.985,450.685,94.184,457.494,91.808,457.92,84.61" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--reverse link tv1 to sp1--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" id="lnk10" data-source-line="48" data-link-type="composition"><path d="M360.748,233.702 C347.518,273.662 323.1,347.48 309.83,387.58" style="stroke:#181818;stroke-width:1;" fill="none" id="tv1-backto-sp1" codeLine="48"/><polygon points="364.52,222.31,358.837,226.749,360.748,233.702,366.431,229.263,364.52,222.31" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-mite