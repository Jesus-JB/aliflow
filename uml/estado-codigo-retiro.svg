<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:774px;height:657px;background:#FFFFFF;" width="774px" height="657px" viewBox="0 0 774 657" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7beta11?><defs><filter id="b1bjf6ti3e1fy20" x="0" y="0" width="1" height="1"><feFlood flood-color="#FFF3B0" result="flood"/><feComposite in="SourceGraphic" in2="flood" operator="over"/></filter></defs><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="240.747" y="22.995" fill="#000" font-size="14" textLength="285.605" font-weight="700">Diagrama de Estado — CodigoRetiro</text></g><g class="legend" data-source-line="8"><rect x="12" y="49.297" width="458.902" height="26.297" fill="#DDD" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="17" y="67.292" fill="#000" font-size="14" textLength="8.9" filter="url(#b1bjf6ti3e1fy20)">  </text><text x="30.351" y="67.292" fill="#000" font-size="14" textLength="435.552">= propuesta de Ingeniería, pendiente de validar con Negocios</text></g><g class="entity" data-qualified-name="Expirado" id="ent0001" data-source-line="12"><rect x="153.95" y="500.184" width="81.694" height="50" fill="#FFF3B0" style="stroke:#8A6D00;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="153.95" y1="526.481" x2="235.644" y2="526.481" style="stroke:#8A6D00;stroke-width:0.5;"/><text x="163.95" y="518.179" fill="#000" font-size="14" textLength="61.694">Expirado</text></g><g class="start_entity" data-qualified-name=".start." id="ent0002" data-source-line="14"><ellipse cx="429.8" cy="104.594" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="Vigente" id="ent0003" data-source-line="14"><rect x="392.82" y="277.254" width="73.942" height="50" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="392.82" y1="303.551" x2="466.762" y2="303.551" style="stroke:#181818;stroke-width:0.5;"/><text x="402.82" y="295.249" fill="#000" font-size="14" textLength="53.942">Vigente</text></g><g class="entity" data-qualified-name="Usado" id="ent0005" data-source-line="16"><rect x="584.01" y="500.184" width="63.572" height="50" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="584.01" y1="526.481" x2="647.582" y2="526.481" style="stroke:#181818;stroke-width:0.5;"/><text x="594.01" y="518.179" fill="#000" font-size="14" textLength="43.572">Usado</text></g><g class="end_entity" data-qualified-name=".end." id="ent0008" data-source-line="20"><ellipse cx="404.8" cy="632.454" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="404.8" cy="632.454" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN11" id="ent0012" data-source-line="24"><path d="M501.58,259.424 L501.58,298.254 L467.25,302.254 L501.58,306.254 L501.58,345.088 A0,0 0 0 0 501.58,345.088 L734.02,345.088 A0,0 0 0 0 734.02,345.088 L734.02,269.424 L724.02,259.424 L501.58,259.424 A0,0 0 0 0 501.58,259.424" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M724.02,259.424 L724.02,269.424 L734.02,269.424 L724.02,259.424" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="507.58" y="276.491" fill="#000" font-size="13" textLength="180.318">La actualización a Usado es</text><text x="507.58" y="291.623" fill="#000" font-size="13" textLength="211.44">atómica y condicional — evita la</text><text x="507.58" y="306.756" fill="#000" font-size="13" textLength="192.651">doble redención (riesgo R-14,</text><text x="507.58" y="321.889" fill="#000" font-size="13" textLength="187.814">ver Gestion-de-Riesgos.md y</text><text x="507.58" y="337.022" fill="#000" font-size="13" textLength="206.851">secuencia-retiro-entrega.puml).</text></g><g class="entity" data-qualified-name="GMN14" id="ent0015" data-source-line="32"><path d="M6,221.594 L6,382.922 A0,0 0 0 0 6,382.922 L357.592,382.922 A0,0 0 0 0 357.592,382.922 L357.592,306.254 L392.58,302.254 L357.592,298.254 L357.592,231.594 L347.592,221.594 L6,221.594 A0,0 0 0 0 6,221.594" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M347.592,221.594 L347.592,231.594 L357.592,231.594 L347.592,221.594" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="12" y="238.661" fill="#000" font-size="13" textLength="330.592" font-weight="700">Formato (decisión de Negocios, 28-jul-2026):</text><text x="12" y="253.793" fill="#000" font-size="13" textLength="43.17">código</text><text x="59.303" y="253.793" fill="#000" font-size="13" textLength="202.249" font-weight="700">numérico corto de 6 dígitos</text><text x="261.552" y="253.793" fill="#000" font-size="13" textLength="61.464">, no UUID</text><text x="12" y="268.926" fill="#000" font-size="13" textLength="301.063">ni QR — el estudiante se lo dice de viva voz al</text><text x="12" y="284.059" fill="#000" font-size="13" textLength="233.314">Operador y este lo digita en Aliflow.</text><text x="12" y="299.192" fill="#000" font-size="13" textLength="326.289">Consecuencia de diseño: la unicidad se exige solo</text><text x="12" y="314.325" fill="#000" font-size="13" textLength="111.224">entre los códigos</text><text x="127.356" y="314.325" fill="#000" font-size="13" textLength="183.358" font-weight="700">Vigentes del mismo local</text><text x="12" y="329.458" fill="#000" font-size="13" textLength="260.273">(no global ni histórica), y se reintenta la</text><text x="12" y="344.59" fill="#000" font-size="13" textLength="279.887">generación si hay colisión. El espacio corto</text><text x="12" y="359.723" fill="#000" font-size="13" textLength="323.718">obliga además a limitar los intentos de validación</text><text x="12" y="374.856" fill="#000" font-size="13" textLength="263.929">(riesgo R-15 en Gestion-de-Riesgos.md).</text></g><g class="entity" data-qualified-name="GMN17" id="ent0018" data-source-line="45"><path d="M270.71,489.924 L270.71,521.184 L235.95,525.184 L270.71,529.184 L270.71,560.455 A0,0 0 0 0 270.71,560.455 L548.892,560.455 A0,0 0 0 0 548.892,560.455 L548.892,499.924 L538.892,489.924 L270.71,489.924 A0,0 0 0 0 270.71,489.924" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M538.892,489.924 L538.892,499.924 L548.892,499.924 L538.892,489.924" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="276.71" y="506.991" fill="#000" font-size="13" textLength="214.043">Dispara la transición de la Orden</text><text x="276.71" y="522.123" fill="#000" font-size="13" textLength="183.13">asociada a EXPIRADO — ver</text><text x="276.71" y="537.256" fill="#000" font-size="13" textLength="257.182">estado-orden.puml. Mismo mecanismo,</text><text x="276.71" y="552.389" fill="#000" font-size="13" textLength="78.882">dos objetos.</text></g><!--link *start* to Vigente--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk4" data-source-line="14" data-link-type="dependency"><path d="M429.8,115.034 C429.8,144.194 429.8,228.504 429.8,271.974" style="stroke:#181818;stroke-width:1;" fill="none" id="*start*-to-Vigente"/><polygon points="429.8,276.974,433.8,267.974,429.8,271.974,425.8,267.974,429.8,276.974" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="430.8" y="157.661" fill="#000" font-size="13" textLength="188.405">generar(6 dígitos numéricos,</text><text x="470.486" y="172.793" fill="#000" font-size="13" textLength="109.034">fechaExpiracion)</text><text x="446.066" y="187.926" fill="#000" font-size="13" textLength="157.873">[al confirmar la compra]</text></g><!--link Vigente to Usado--><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" id="lnk6" data-source-line="16" data-link-type="dependency"><path d="M444.92,327.654 C455.27,343.794 469.62,365.164 483.8,382.924 C518.34,426.214 559.644,468.859 587.164,496.209" style="stroke:#181818;stroke-width:1;" fill="none" id="Vigente-to-Usado"/><polygon points="590.71,499.734,587.146,490.552,587.164,496.209,581.507,496.227,590.71,499.734" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="586.728" y="425.991" fill="#000" font-size="13" textLength="136.443">invalidarSiNoUsado()</text><text x="551.8" y="441.123" fill="#000" font-size="13" textLength="206.299">UPDATE ... WHERE usado=false</text><text x="560.874" y="456.256" fill="#000" font-size="13" textLength="188.151">[Operador confirma entrega]</text></g><!--link Vigente to Expirado--><g class="link" data-entity-1="ent0003" data-entity-2="ent0001" id="lnk7" data-source-line="18" data-link-type="dependency"><path d="M416.58,327.444 C406.59,344.294 391.73,366.584 374.8,382.924 C356.96,400.124 347.79,398.274 327.8,412.924 C289.55,440.944 251.763,473.288 225.473,496.578" style="stroke:#181818;stroke-width:1;" fill="none" id="Vigente-to-Expirado"/><polygon points="221.73,499.894,231.119,496.92,225.473,496.578,225.814,490.932,221.73,499.894" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="328.8" y="433.491" fill="#000" font-size="13" textLength="174.034">fechaExpiracion alcanzada</text><text x="372.723" y="448.623" fill="#000" font-size="13" textLength="86.188">sin ser usado</text></g><!--link Usado to *end*--><g class="link" data-entity-1="ent0005" data-entity-2="ent0008" id="lnk9" data-source-line="20" data-link-type="dependency"><path d="M583.69,549.964 C578.18,553.664 572.41,557.304 566.8,560.454 C511.91,591.274 445.736,616.546 419.686,626.076" style="stroke:#181818;stroke-width:1;" fill="none" id="Usado-to-*end*"/><polygon points="414.99,627.794,424.816,628.458,419.686,626.076,422.068,620.945,414.99,627.794" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Expirado to *end*--><g class="link" data-entity-1="ent00