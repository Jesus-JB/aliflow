<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:756px;height:914px;background:#FFFFFF;" width="756px" height="914px" viewBox="0 0 756 914" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7beta11?><defs><filter id="b2jfjqkpe7c200" x="0" y="0" width="1" height="1"><feFlood flood-color="#FFF3B0" result="flood"/><feComposite in="SourceGraphic" in2="flood" operator="over"/></filter><filter id="b2jfjqkpe7c201" x="0" y="0" width="1" height="1"><feFlood flood-color="#F1F1F1" result="flood"/><feComposite in="SourceGraphic" in2="flood" operator="over"/></filter></defs><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="231.723" y="22.995" fill="#000" font-size="14" textLength="285.605" font-weight="700">Diagrama de Estado — CodigoRetiro</text></g><g class="legend" data-source-line="8"><rect x="12" y="49.297" width="458.902" height="42.594" fill="#DDD" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="17" y="67.292" fill="#000" font-size="14" textLength="8.9" filter="url(#b2jfjqkpe7c200)">  </text><text x="30.351" y="67.292" fill="#000" font-size="14" textLength="435.552">= propuesta de Ingeniería, pendiente de validar con Negocios</text><text x="17" y="83.589" fill="#000" font-size="14" textLength="8.9" filter="url(#b2jfjqkpe7c201)">  </text><text x="30.351" y="83.589" fill="#000" font-size="14" textLength="314.002">= confirmado en acta / decisión de Negocios</text></g><g class="start_entity" data-qualified-name=".start." id="ent0001" data-source-line="13"><ellipse cx="423.8" cy="120.891" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="Valido" id="ent0002" data-source-line="13"><rect x="392.1" y="293.431" width="63.388" height="50" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="392.1" y1="319.728" x2="455.488" y2="319.728" style="stroke:#181818;stroke-width:0.5;"/><text x="402.1" y="311.426" fill="#000" font-size="14" textLength="43.388">Valido</text></g><g class="entity" data-qualified-name="Utilizado" id="ent0004" data-source-line="15"><rect x="251.4" y="490.961" width="80.785" height="50" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="251.4" y1="517.258" x2="332.185" y2="517.258" style="stroke:#181818;stroke-width:0.5;"/><text x="261.4" y="508.956" fill="#000" font-size="14" textLength="60.785">Utilizado</text></g><g class="entity" data-qualified-name="Vencido" id="ent0006" data-source-line="17"><rect x="520.74" y="490.961" width="76.103" height="50" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="520.74" y1="517.258" x2="596.843" y2="517.258" style="stroke:#181818;stroke-width:0.5;"/><text x="530.74" y="508.956" fill="#000" font-size="14" textLength="56.103">Vencido</text></g><g class="end_entity" data-qualified-name=".end." id="ent0008" data-source-line="19"><ellipse cx="330.8" cy="750.721" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="330.8" cy="750.721" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN11" id="ent0012" data-source-line="23"><path d="M490.58,275.591 L490.58,314.431 L455.96,318.431 L490.58,322.431 L490.58,361.255 A0,0 0 0 0 490.58,361.255 L723.02,361.255 A0,0 0 0 0 723.02,361.255 L723.02,285.591 L713.02,275.591 L490.58,275.591 A0,0 0 0 0 490.58,275.591" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M713.02,275.591 L713.02,285.591 L723.02,285.591 L713.02,275.591" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="496.58" y="292.658" fill="#000" font-size="13" textLength="196.301">La actualización a Utilizado es</text><text x="496.58" y="307.79" fill="#000" font-size="13" textLength="211.44">atómica y condicional — evita la</text><text x="496.58" y="322.923" fill="#000" font-size="13" textLength="192.651">doble redención (riesgo R-14,</text><text x="496.58" y="338.056" fill="#000" font-size="13" textLength="187.814">ver Gestion-de-Riesgos.md y</text><text x="496.58" y="353.189" fill="#000" font-size="13" textLength="206.851">secuencia-retiro-entrega.puml).</text></g><g class="entity" data-qualified-name="GMN14" id="ent0015" data-source-line="31"><path d="M6,252.891 L6,383.953 A0,0 0 0 0 6,383.953 L357.592,383.953 A0,0 0 0 0 357.592,383.953 L357.592,322.431 L391.74,318.431 L357.592,314.431 L357.592,262.891 L347.592,252.891 L6,252.891 A0,0 0 0 0 6,252.891" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M347.592,252.891 L347.592,262.891 L357.592,262.891 L347.592,252.891" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="12" y="269.958" fill="#000" font-size="13" textLength="330.592" font-weight="700">Formato (decisión de Negocios, 28-jul-2026):</text><text x="12" y="285.09" fill="#000" font-size="13" textLength="43.17">código</text><text x="59.303" y="285.09" fill="#000" font-size="13" textLength="202.249" font-weight="700">numérico corto de 6 dígitos</text><text x="261.552" y="285.09" fill="#000" font-size="13" textLength="61.464">, no UUID</text><text x="12" y="300.223" fill="#000" font-size="13" textLength="301.063">ni QR — el estudiante se lo dice de viva voz al</text><text x="12" y="315.356" fill="#000" font-size="13" textLength="233.314">Operador y este lo digita en Aliflow.</text><text x="12" y="330.489" fill="#000" font-size="13" textLength="279.03">La unicidad se exige solo entre los códigos</text><text x="12" y="345.622" fill="#000" font-size="13" textLength="172.415" font-weight="700">Válidos del mismo local</text><text x="184.415" y="345.622" fill="#000" font-size="13" textLength="84.221">, no global ni</text><text x="12" y="360.754" fill="#000" font-size="13" textLength="289.472">histórica, y se reintenta la generación si hay</text><text x="12" y="375.887" fill="#000" font-size="13" textLength="53.035">colisión.</text></g><g class="entity" data-qualified-name="GMN17" id="ent0018" data-source-line="42"><path d="M379.93,601.961 L379.93,899.484 A0,0 0 0 0 379.93,899.484 L737.654,899.484 A0,0 0 0 0 737.654,899.484 L737.654,611.961 L727.654,601.961 L562.8,601.961 L558.8,541.431 L554.8,601.961 L379.93,601.961 A0,0 0 0 0 379.93,601.961" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M727.654,601.961 L727.654,611.961 L737.654,611.961 L727.654,601.961" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="385.93" y="619.028" fill="#000" font-size="13" textLength="324.854" font-weight="700">Regla de expiración (acta 30-jul-2026, §6.2):</text><text x="385.93" y="634.16" fill="#000" font-size="13" textLength="328.612">el código vale **únicamente durante el día en que</text><text x="385.93" y="649.293" fill="#000" font-size="13" textLength="302.853">se hizo la compra**. Si se presenta otro día, el</text><text x="385.93" y="664.426" fill="#000" font-size="13" textLength="320.525">sistema debe mostrarlo como vencido o inválido.</text><text x="385.93" y="679.559" fill="#000" font-size="13" textLength="336.724">La vigencia termina, como máximo, al terminar ese</text><text x="385.93" y="694.692" fill="#000" font-size="13" textLength="71.76">mismo día.</text><text x="385.93" y="709.824" fill="#000" font-size="13"> </text><text x="385.93" y="724.957" fill="#000" font-size="13" textLength="28.038">Esto</text><text x="418.1" y="724.957" fill="#000" font-size="13" textLength="149.982" font-weight="700">cierra la decisión #5</text><text x="568.082" y="724.957" fill="#000" font-size="13" textLength="131.308">, que estaba abierta</text><text x="385.93" y="740.09" fill="#000" font-size="13" textLength="282.217">desde el 27-jul, y refuerza la mitigación del</text><text x="385.93" y="755.223" fill="#000" font-size="13" textLength="304.465">riesgo R-15: acotar la vigencia a un día reduce</text><text x="385.93" y="770.356" fill="#000" font-size="13" textLength="331.944">drásticamente el universo de códigos vigentes a la</text><text x="385.93" y="785.488" fill="#000" font-size="13" textLength="324.34">vez, que es lo que hace viable usar solo 6 dígitos.</text><text x="385.93" y="800.621" fill="#000" font-size="13"> </text><text x="385.93" y="815.754" fill="#000" font-size="13" textLength="331.563">Dispara además la transición de la Orden asociada</text><text x="385.93" y="830.887" fill="#000" font-size="13" textLength="253.043">a EXPIRADO — ver estado-orden.puml.</text><text x="385.93" y="846.02" fill="#000" font-size="13"> </text><text x="385.93" y="861.153" fill="#000" font-size="13" textLength="137.56" filter="url(#b2jfjqkpe7c200)">Lo que sigue abierto:</text><text x="527.622" y="861.153" fill="#000" font-size="13" textLength="102.794">qué pasa con el</text><text x="634.549" y="861.153" fill="#000" font-size="13" textLength="47.176" font-weight="700">dinero</text><text x="385.93" y="876.285" fill="#000" font-size="13" textLength="334.134">de una orden vencida. El acta define cuándo vence</text><text x="385.93" y="891.418" fill="#000" font-size="13" textLength="202.731">el código, no si hay reembolso.</text></g><!--link *start* to Valido--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk3" data-source-line="13" data-link-type="dependency"><path d="M423.8,131.321 C423.8,160.471 423.8,244.721 423.8,288.161" style="stroke:#181818;stroke-width:1;" fill="none" id="*start*-to-Valido"/><polygon points="423.8,293.161,427.8,284.161,423.8,288.161,419.8,284.161,423.8,293.161" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="468.377" y="173.958" fill="#000" font-size="13" textLength="189.344">generar(6 dígitos numéricos)</text><text x="424.8" y="189.09" fill="#000" font-size="13" textLength="276.498">fechaExpiracion = min(horaMaximaRetiro,</text><text x="483.544" y="204.223" fill="#000" font-size="13" textLength="159.009">fin del día de la compra)</text><text x="484.113" y="219.356" fill="#000" font-size="13" textLength="157.873">[al confirmar la compra]</text></g><!--link Valido to Utilizado--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk5" data-source-line="15" data-link-type="dependency"><path d="M410.31,343.881 C401.74,357.411 389.49,373.541 374.8,383.961 C339.37,409.071 307.36,378.851 281.8,413.961 C265.72,436.041 271.066,463.704 279.136,485.814" style="stroke:#181818;stroke-width:1;" fill="none" id="Valido-to-Utilizado"/><polygon points="280.85,490.511,281.522,480.685,279.136,485.814,274.007,483.428,280.85,490.511" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="332.82" y="427.028" fill="#000" font-size="13" textLength="136.443">invalidarSiNoUsado()</text><text x="282.8" y="442.16" fill="#000" font-size="13" textLength="236.482">UPDATE ... WHERE estado='VALIDO'</text><text x="306.966" y="457.293" fill="#000" font-size="13" textLength="188.151">[Operador confirma entrega]</text></g><!--link Valido to Vencido--><g class="link" data-entity-1="ent0002" data-entity-2="ent0006" id="lnk7" data-source-line="17" data-link-type="dependency"><path d="M438.83,343.651 C447.66,356.621 459.65,372.281 472.8,383.961 C492.45,401.431 507.13,393.611 523.8,413.961 C542.02,436.211 550.064,463.631 554.314,485.681" style="stroke:#181818;stroke-width:1;" fill="none" id="Valido-to-Vencido"/><polygon points="555.26,490.591,557.484,480.996,554.314,485.681,549.629,482.51,555.26,490.591" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="559.527" y="434.528" fill="#000" font-size="13" textLength="168.797">venció el horario de retiro</text><text x="547.8" y="449.66" fill="#000" font-size="13" textLength="192.251">o terminó el día de la compra</text></g><!--link Utilizado to *end*--><g class="link" data-entity-1="ent0004" data-entity-2="ent0008" 