<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:777px;height:764px;background:#FFFFFF;" width="777px" height="764px" viewBox="0 0 777 764" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7beta11?><defs><filter id="be8cygeka0d1w0" x="0" y="0" width="1" height="1"><feFlood flood-color="#FFF3B0" result="flood"/><feComposite in="SourceGraphic" in2="flood" operator="over"/></filter><filter id="be8cygeka0d1w1" x="0" y="0" width="1" height="1"><feFlood flood-color="#F1F1F1" result="flood"/><feComposite in="SourceGraphic" in2="flood" operator="over"/></filter></defs><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="269.554" y="22.995" fill="#000" font-size="14" textLength="231.253" font-weight="700">Diagrama de Estado — Orden</text></g><g class="legend" data-source-line="8"><rect x="12" y="49.297" width="458.902" height="42.594" fill="#DDD" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="17" y="67.292" fill="#000" font-size="14" textLength="8.9" filter="url(#be8cygeka0d1w0)">  </text><text x="30.351" y="67.292" fill="#000" font-size="14" textLength="435.552">= propuesta de Ingeniería, pendiente de validar con Negocios</text><text x="17" y="83.589" fill="#000" font-size="14" textLength="8.9" filter="url(#be8cygeka0d1w1)">  </text><text x="30.351" y="83.589" fill="#000" font-size="14" textLength="314.002">= confirmado en acta / decisión de Negocios</text></g><g class="start_entity" data-qualified-name=".start." id="ent0001" data-source-line="13"><ellipse cx="437.39" cy="120.891" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="COMPRADO" id="ent0002" data-source-line="13"><rect x="386.18" y="270.861" width="102.421" height="50" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="386.18" y1="297.157" x2="488.601" y2="297.157" style="stroke:#181818;stroke-width:0.5;"/><text x="396.18" y="288.856" fill="#000" font-size="14" textLength="82.421">COMPRADO</text></g><g class="entity" data-qualified-name="ENTREGADO" id="ent0004" data-source-line="15"><rect x="591.06" y="539.191" width="108.669" height="50" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="591.06" y1="565.488" x2="699.729" y2="565.488" style="stroke:#181818;stroke-width:0.5;"/><text x="601.06" y="557.186" fill="#000" font-size="14" textLength="88.669">ENTREGADO</text></g><g class="entity" data-qualified-name="EXPIRADO" id="ent0006" data-source-line="17"><rect x="120.33" y="539.191" width="92.112" height="50" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="120.33" y1="565.488" x2="212.442" y2="565.488" style="stroke:#181818;stroke-width:0.5;"/><text x="130.33" y="557.186" fill="#000" font-size="14" textLength="72.112">EXPIRADO</text></g><g class="end_entity" data-qualified-name=".end." id="ent0008" data-source-line="19"><ellipse cx="405.39" cy="739.551" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="405.39" cy="739.551" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN11" id="ent0012" data-source-line="23"><path d="M247.12,460.821 L247.12,560.191 L212.75,564.191 L247.12,568.191 L247.12,667.547 A0,0 0 0 0 247.12,667.547 L555.669,667.547 A0,0 0 0 0 555.669,667.547 L555.669,470.821 L545.669,460.821 L247.12,460.821 A0,0 0 0 0 247.12,460.821" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M545.669,460.821 L545.669,470.821 L555.669,470.821 L545.669,460.821" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="253.12" y="477.888" fill="#000" font-size="13" textLength="281.646" font-weight="700">Regla cerrada (acta 30-jul-2026, §6.2).</text><text x="253.12" y="493.02" fill="#000" font-size="13" textLength="263.421">Ya no es una propuesta de Ingeniería: la</text><text x="253.12" y="508.153" fill="#000" font-size="13" textLength="272.632">Orden pasa a EXPIRADO cuando vence su</text><text x="253.12" y="523.286" fill="#000" font-size="13" textLength="287.549">CodigoRetiro, y este vence como máximo al</text><text x="253.12" y="538.419" fill="#000" font-size="13" textLength="237.453">terminar el mismo día de la compra.</text><text x="253.12" y="553.552" fill="#000" font-size="13" textLength="199.342">Ver estado-codigo-retiro.puml.</text><text x="253.12" y="568.684" fill="#000" font-size="13"> </text><text x="253.12" y="583.817" fill="#000" font-size="13" textLength="172.504" filter="url(#be8cygeka0d1w0)">Lo único que sigue abierto</text><text x="429.756" y="583.817" fill="#000" font-size="13" textLength="105.955">es qué pasa con</text><text x="253.12" y="598.95" fill="#000" font-size="13" textLength="11.61">el</text><text x="268.862" y="598.95" fill="#000" font-size="13" textLength="47.176" font-weight="700">dinero</text><text x="316.038" y="598.95" fill="#000" font-size="13" textLength="188.887">: si se reembolsa al saldo del</text><text x="253.12" y="614.083" fill="#000" font-size="13" textLength="265.472">estudiante, si se pierde, o si se le liquida</text><text x="253.12" y="629.216" fill="#000" font-size="13" textLength="267.865">igual al proveedor porque el almuerzo se</text><text x="253.12" y="644.348" fill="#000" font-size="13" textLength="276.148">preparó. El acta define la expiración, no la</text><text x="253.12" y="659.481" fill="#000" font-size="13" textLength="144.447">política de reembolso.</text></g><g class="entity" data-qualified-name="GMN14" id="ent0015" data-source-line="39"><path d="M6,237.891 L6,353.82 A0,0 0 0 0 6,353.82 L350.781,353.82 A0,0 0 0 0 350.781,353.82 L350.781,299.861 L385.84,295.861 L350.781,291.861 L350.781,247.891 L340.781,237.891 L6,237.891 A0,0 0 0 0 6,237.891" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M340.781,237.891 L340.781,247.891 L350.781,247.891 L340.781,237.891" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="12" y="254.958" fill="#000" font-size="13" textLength="174.611" font-weight="700">Cambio del 30-jul-2026:</text><text x="190.744" y="254.958" fill="#000" font-size="13" textLength="102.146">la validación de</text><text x="12" y="270.09" fill="#000" font-size="13" textLength="285.01">disponibilidad ya no se hace contra el stock</text><text x="12" y="285.223" fill="#000" font-size="13" textLength="141.413">del ERP sino contra el</text><text x="157.545" y="285.223" fill="#000" font-size="13" textLength="153.245" font-weight="700">inventario reservado</text><text x="12" y="300.356" fill="#000" font-size="13" textLength="323.781">para Aliflow (`InventarioReservado.disponible()`).</text><text x="12" y="315.489" fill="#000" font-size="13" textLength="269.401">El local aparta un cupo exclusivo, así que</text><text x="12" y="330.622" fill="#000" font-size="13" textLength="283.283">Aliflow no compite con la caja por la misma</text><text x="12" y="345.754" fill="#000" font-size="13" textLength="227.208">unidad. Ver diagrama-clases.puml.</text></g><!--link *start* to COMPRADO--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk3" data-source-line="13" data-link-type="dependency"><path d="M437.39,131.191 C437.39,157.231 437.39,226.471 437.39,265.381" style="stroke:#181818;stroke-width:1;" fill="none" id="*start*-to-COMPRADO"/><polygon points="437.39,270.381,441.39,261.381,437.39,265.381,433.39,261.381,437.39,270.381" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="484.303" y="173.958" fill="#000" font-size="13" textLength="124.249">confirmarCompra()</text><text x="438.39" y="189.09" fill="#000" font-size="13" textLength="216.074">(saldo validado y cupo reservado</text><text x="474.772" y="204.223" fill="#000" font-size="13" textLength="143.311">de Aliflow consumido)</text></g><!--link COMPRADO to ENTREGADO--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk5" data-source-line="15" data-link-type="dependency"><path d="M458.52,321.091 C485.8,352.651 534.42,409.851 573.39,460.821 C593.32,486.891 611.98,513.685 626.24,534.675" style="stroke:#181818;stroke-width:1;" fill="none" id="COMPRADO-to-ENTREGADO"/><polygon points="629.05,538.811,627.301,529.118,626.24,534.675,620.684,533.614,629.05,538.811" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="563.396" y="404.388" fill="#000" font-size="13" textLength="182.958">marcarEntregado(operador)</text><text x="548.39" y="419.52" fill="#000" font-size="13" textLength="212.97">[CodigoRetiro válido y no usado]</text></g><!--link COMPRADO to EXPIRADO--><g class="link" data-entity-1="ent0002" data-entity-2="ent0006" id="lnk7" data-source-line="17" data-link-type="dependency"><path d="M409.57,321.341 C397.26,331.771 382.43,343.811 368.39,353.821 C347.6,368.661 340.05,368.811 319.39,383.821 C276.81,414.781 263.6,420.811 229.39,460.821 C208.51,485.251 192.287,512.911 180.817,534.601" style="stroke:#181818;stroke-width:1;" fill="none" id="COMPRADO-to-EXPIRADO"/><polygon points="178.48,539.021,186.223,532.934,180.817,534.601,179.151,529.195,178.48,539.021" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="384.831" y="396.888" fill="#000" font-size="13" textLength="56.354">expirar()</text><text x="320.39" y="412.02" fill="#000" font-size="13" textLength="185.237">[terminó el día de la compra</text><text x="321.212" y="427.153" fill="#000" font-size="13" textLength="183.593">o venció horaMaximaRetiro]</text></g><!--link ENTREGADO to *end*--><g class="link" data-entity-1="ent0004" data-entity-2="ent0008" id="lnk9" data-source-line="19" data-link-type="dependency"><path d="M633.33,589.661 C621.01,612.481 599.94,646.131 573.39,667.551 C522.62,708.511 449.649,728.384 421.169,735.03