oke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="795.502" y="387.295" fill="#000" font-size="14" textLength="138.517">det1 : OrdenDetalle</text><line x1="784.51" y1="392.597" x2="945.01" y2="392.597" style="stroke:#181818;stroke-width:0.5;"/><text x="789.51" y="409.592" fill="#000" font-size="14" textLength="90.419">cantidad = 1</text><text x="789.51" y="425.889" fill="#000" font-size="14" textLength="150.5">precioUnitario = 3.50</text></g><g class="entity" data-qualified-name="codigo1" id="ent0010" data-source-line="52"><rect x="980.94" y="364.15" width="283.626" height="77.188" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1042.94" y="379.145" fill="#000" font-size="14" textLength="159.626">codigo1 : CodigoRetiro</text><line x1="981.94" y1="384.447" x2="1263.566" y2="384.447" style="stroke:#181818;stroke-width:0.5;"/><text x="986.94" y="401.442" fill="#000" font-size="14" textLength="122.028">valor = "418327"</text><text x="986.94" y="417.739" fill="#000" font-size="14" textLength="271.626">fechaExpiracion = "2026-07-27 14:00"</text><text x="986.94" y="434.036" fill="#000" font-size="14" textLength="96.134">usado = false</text></g><g class="entity" data-qualified-name="GMN22" id="ent0023" data-source-line="71"><path d="M376.94,337.21 L376.94,468.273 A0,0 0 0 0 376.94,468.273 L664.58,468.273 A0,0 0 0 0 664.58,468.273 L664.58,347.21 L654.58,337.21 L480.98,337.21 L404.82,230.44 L472.98,337.21 L376.94,337.21 A0,0 0 0 0 376.94,337.21" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M654.58,337.21 L654.58,347.21 L664.58,347.21 L654.58,337.21" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="382.94" y="354.277" fill="#000" font-size="13" textLength="222.219">Ilustra la decisión de Negocios del</text><text x="382.94" y="369.41" fill="#000" font-size="13" textLength="138.842">28-jul-2026: Ana hizo</text><text x="525.915" y="369.41" fill="#000" font-size="13" textLength="122.427" font-weight="700">una sola recarga</text><text x="382.94" y="384.543" fill="#000" font-size="13" textLength="248.968">y le quedan $8.50 en una bolsa única,</text><text x="382.94" y="399.675" fill="#000" font-size="13" textLength="264.031">gastables en cualquier local. Los objetos</text><text x="382.94" y="414.808" fill="#000" font-size="13" textLength="102.413">SaldoProveedor</text><text x="489.485" y="414.808" fill="#000" font-size="13" textLength="18.186" font-weight="700">no</text><text x="511.804" y="414.808" fill="#000" font-size="13" textLength="126.21">reparten ese saldo:</text><text x="382.94" y="429.941" fill="#000" font-size="13" textLength="253.748">son el libro interno de lo que Aliflow ya</text><text x="382.94" y="445.074" fill="#000" font-size="13" textLength="266.64">le debe a cada local por compras hechas</text><text x="382.94" y="460.207" fill="#000" font-size="13" textLength="260.844">($3.50 a Barú, $2.00 a Caramel Coffee).</text></g><g class="entity" data-qualified-name="GMN25" id="ent0026" data-source-line="82"><path d="M1069.77,622.17 L1069.77,692.701 A0,0 0 0 0 1069.77,692.701 L1347.749,692.701 A0,0 0 0 0 1347.749,692.701 L1347.749,632.17 L1337.749,622.17 L1201.04,622.17 L1135.63,441.57 L1193.04,622.17 L1069.77,622.17 A0,0 0 0 0 1069.77,622.17" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1337.749,622.17 L1337.749,632.17 L1347.749,632.17 L1337.749,622.17" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="1075.77" y="639.237" fill="#000" font-size="13" textLength="137.896">El código de retiro es</text><text x="1217.799" y="639.237" fill="#000" font-size="13" textLength="111.097" font-weight="700">numérico corto</text><text x="1075.77" y="654.37" fill="#000" font-size="13" textLength="230.801">(6 dígitos, decisión de Negocios del</text><text x="1075.77" y="669.503" fill="#000" font-size="13" textLength="256.979">28-jul-2026): Ana se lo dice de viva voz</text><text x="1075.77" y="684.635" fill="#000" font-size="13" textLength="237.955">al Operador, que lo digita en Aliflow.</text></g><g class="entity" data-qualified-name="GMN28" id="ent0029" data-source-line="89"><path d="M1299.48,299.38 L1299.48,506.107 L1574.031,506.107 L1574.031,309.38 L1564.031,299.38 L1299.48,299.38" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1564.031,299.38 L1564.031,309.38 L1574.031,309.38 L1564.031,299.38" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="1305.48" y="316.447" fill="#000" font-size="13" textLength="211.713">El estudiante ya compró (estado</text><text x="1305.48" y="331.58" fill="#000" font-size="13" textLength="249.126">COMPRADO), tiene su código de retiro</text><text x="1305.48" y="346.713" fill="#000" font-size="13" textLength="217.902">vigente (usado=false). Cuando el</text><text x="1305.48" y="361.845" fill="#000" font-size="13" textLength="222.803">Operador lo valide, orden1.estado</text><text x="1305.48" y="376.978" fill="#000" font-size="13" textLength="253.551">pasará a ENTREGADO y codigo1.usado</text><text x="1305.48" y="392.111" fill="#000" font-size="13" textLength="208.394">a true (ver estado-orden.puml y</text><text x="1305.48" y="407.244" fill="#000" font-size="13" textLength="178.045">estado-codigo-retiro.puml).</text><text x="1305.48" y="422.377" fill="#000" font-size="13"> </text><text x="1305.48" y="437.509" fill="#000" font-size="13" textLength="234.508">orden1.proveedor = baru, igual que</text><text x="1305.48" y="452.642" fill="#000" font-size="13" textLength="230.744">det1.plato1.proveedor — cumple el</text><text x="1305.48" y="467.775" fill="#000" font-size="13" textLength="238.545">invariante de diagrama-clases.puml:</text><text x="1305.48" y="482.908" fill="#000" font-size="13" textLength="224.84">una orden nunca mezcla platos de</text><text x="1305.48" y="498.041" fill="#000" font-size="13" textLength="108.735">locales distintos.</text></g><!--reverse link ana to tv1--><g class="link" data-entity-1="ent0004" data-entity-2="ent000