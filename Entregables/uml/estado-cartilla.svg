<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="786px" preserveAspectRatio="none" style="width:1143px;height:786px;background:#FFFFFF;" version="1.1" viewBox="0 0 1143 786" width="1143px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><g class="title" data-source-line="2"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="310.4678" x="413.0122" y="23.5352">Diagrama de Estado &#8212; Cartilla de fidelidad</text></g><g class="entity" data-qualified-name="EnCurso" data-source-line="4" id="ent0001"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="76.1162" x="432.98" y="204.3883"/><line style="stroke:#181818;stroke-width:0.5;" x1="432.98" x2="509.0962" y1="230.8766" y2="230.8766"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="56.1162" x="442.98" y="222.9234">EnCurso</text></g><g class="entity" data-qualified-name="Completa" data-source-line="5" id="ent0002"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="84.9824" x="208.55" y="405.9083"/><line style="stroke:#181818;stroke-width:0.5;" x1="208.55" x2="293.5324" y1="432.3966" y2="432.3966"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="64.9824" x="218.55" y="424.4434">Completa</text></g><g class="entity" data-qualified-name="Canjeada" data-source-line="6" id="ent0003"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="82.4395" x="168.82" y="573.5283"/><line style="stroke:#181818;stroke-width:0.5;" x1="168.82" x2="251.2595" y1="600.0166" y2="600.0166"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="62.4395" x="178.82" y="592.0634">Canjeada</text></g><g class="entity" data-qualified-name="Expirada" data-source-line="7" id="ent0004"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="79.0352" x="507.52" y="573.5283"/><line style="stroke:#181818;stroke-width:0.5;" x1="507.52" x2="586.5552" y1="600.0166" y2="600.0166"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="59.0352" x="517.52" y="592.0634">Expirada</text></g><g class="start_entity" data-qualified-name=".start." data-source-line="9" id="ent0005"><ellipse cx="471.04" cy="53.4883" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/></g><g class="end_entity" data-qualified-name=".end." data-source-line="20" id="ent0012"><ellipse cx="364.04" cy="727.7983" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="364.04" cy="727.7983" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN15" data-source-line="24" id="ent0016"><path d="M821.6,155.4883 L821.6,225.3883 L509.43,229.3883 L821.6,233.3883 L821.6,303.2832 A0,0 0 0 0 821.6,303.2832 L1128.4921,303.2832 A0,0 0 0 0 1128.4921,303.2832 L1128.4921,165.4883 L1118.4921,155.4883 L821.6,155.4883 A0,0 0 0 0 821.6,155.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1118.4921,155.4883 L1118.4921,165.4883 L1128.4921,165.4883 L1118.4921,155.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="276.6245" x="827.6" y="173.0566">El sello se acredita en `marcarEntregado()`,</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="16.8403" x="827.6" y="188.3672">no</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="227.3032" x="848.5536" y="188.3672">en `confirmarCompra()`: una orden</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="285.8921" x="827.6" y="203.6777">comprada y nunca retirada no suma. Adem&#225;s</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="236.1328" x="827.6" y="218.9883">`Sello &#8594; Orden` es &#250;nico, as&#237; que un</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="273.3745" x="827.6" y="234.2988">reintento de entrega no acredita dos veces.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="827.6" y="249.6094">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="252.1353" x="827.6" y="264.9199">`maxSellosPorDia` (por defecto 1) evita</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="254.0078" x="827.6" y="280.2305">que se llene la cartilla comprando varias</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="123.7158" x="827.6" y="295.541">veces el mismo d&#237;a.</text></g><g class="entity" data-qualified-name="GMN18" data-source-line="36" id="ent0019"><path d="M328.95,395.2883 L328.95,426.9083 L293.92,430.9083 L328.95,434.9083 L328.95,466.5305 A0,0 0 0 0 328.95,466.5305 L621.1409,466.5305 A0,0 0 0 0 621.1409,466.5305 L621.1409,405.2883 L611.1409,395.2883 L328.95,395.2883 A0,0 0 0 0 328.95,395.2883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M611.1409,395.2883 L611.1409,405.2883 L621.1409,405.2883 L611.1409,395.2883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="271.1909" x="334.95" y="412.8566">El canje se aplica sobre una Orden real con</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="270.7783" x="334.95" y="428.1672">`esCanje = true` y total $0 &#8212; el plato sale</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="248.5615" x="334.95" y="443.4777">del inventario igual y el ERP del local se</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="79.0093" x="334.95" y="458.7883">entera igual.</text></g><g class="entity" data-qualified-name="GMN21" data-source-line="43" id="ent0022"><path d="M6,684.5283 L6,771.081 A0,0 0 0 0 6,771.081 L318.0845,771.081 A0,0 0 0 0 318.0845,771.081 L318.0845,694.5283 L308.0845,684.5283 L182.15,684.5283 L200.9,623.7683 L174.15,684.5283 L6,684.5283 A0,0 0 0 0 6,684.5283" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M308.0845,684.5283 L308.0845,694.5283 L318.0845,694.5283 L308.0845,684.5283" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="258.4829" x="12" y="702.0966">Cuando una cartilla se cierra (Canjeada o</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="270.2896" x="12" y="717.4072">Expirada), la siguiente entrega en ese local</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="245.3306" x="12" y="732.7177">emite una cartilla nueva en EnCurso. El</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="101.3784" x="12" y="748.0283">estudiante tiene</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="181.4795" x="117.4917" y="748.0283">una cartilla activa por local</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="298.9712" y="748.0283">,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="120.3389" x="12" y="763.3388">no una sola global.</text></g><g class="entity" data-qualified-name="GMN24" data-source-line="51" id="ent0025"><path d="M409.99,684.5283 L409.99,771.081 A0,0 0 0 0 409.99,771.081 L930.0872,771.081 A0,0 0 0 0 930.0872,771.081 L930.0872,694.5283 L920.0872,684.5283 L632.77,684.5283 L570.47,623.7683 L624.77,684.5283 L409.99,684.5283 A0,0 0 0 0 409.99,684.5283" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M920.0872,684.5283 L920.0872,694.5283 L930.0872,694.5283 L920.0872,684.5283" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="499.0972" x="415.99" y="702.0966">`vigenciaCartillaDias` es opcional: si el local no la define, la cartilla no caduca.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="267.979" x="415.99" y="717.4072">el cliente no defini&#243; si una cartilla a medio</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="247.6538" x="415.99" y="732.7177">llenar caduca. Si decide que no caduca,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="241.8584" x="415.99" y="748.0283">basta con dejar el campo en nulo &#8212; el</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="120.7769" x="415.99" y="763.3388">modelo no cambia.</text></g><!--link *start* to EnCurso--><g class="link" data-entity-1="ent0005" data-entity-2="ent0001" data-link-type="dependency" data-source-line="9" id="lnk6"><path d="M471.04,63.8383 C471.04,90.0783 471.04,160.0583 471.04,199.0883" fill="none" id="*start*-to-EnCurso" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="471.04,204.0883,475.04,195.0883,471.04,199.0883,467.04,195.0883,471.04,204.0883" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="156.4316" x="487.7378" y="107.0566">emitirCartilla(estudiante)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="187.8271" x="472.04" y="122.3672">[primera entrega en ese local]</text></g><!--link EnCurso to EnCurso--><g class="link" data-entity-1="ent0001" data-entity-2="ent0001" data-link-type="dependency" data-source-line="11" id="lnk7"><path d="M509.38,207.4583 C527.82,204.7483 544.1,212.0583 544.1,229.3883 C544.1,246.7183 532.7669,254.7553 514.3269,252.0453" fill="none" id="EnCurso-to-EnCurso" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="509.38,251.3183,517.7027,256.5844,514.3269,252.0453,518.866,248.6694,509.38,251.3183" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="130.6982" x="608.4857" y="226.9566">acreditarSello(orden)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="247.4697" x="550.1" y="242.2672">[sellosAcumulados &lt; sellosRequeridos]</text></g><!--link EnCurso to Completa--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="13" id="lnk8"><path d="M444.07,254.8483 C401.73,293.2483 323.8644,363.8701 281.5944,402.1901" fill="none" id="EnCurso-to-Completa" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="277.89,405.5483,287.2444,402.467,281.5944,402.1901,281.8713,396.54,277.89,405.5483" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="130.6982" x="419.0027" y="346.8566">acreditarSello(orden)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="257.8037" x="355.45" y="362.1672">[sellosAcumulados == sellosRequeridos]</text></g><!--link Completa to Canjeada--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="15" id="lnk9"><path d="M229.42,456.1483 C220.66,467.5583 211.56,481.8683 207.04,496.5283 C199.24,521.8383 200.9034,547.4905 204.2234,568.3305" fill="none" id="Completa-to-Canjeada" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="205.01,573.2683,207.5443,563.7511,204.2234,568.3305,199.6439,565.0097,205.01,573.2683" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="90.854" x="286.6525" y="510.0966">canjear(orden)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="244.8418" x="209.6587" y="525.4072">UPDATE ... WHERE estado='COMPLETA'</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="248.0791" x="208.04" y="540.7177">[Operador valida la entrega del premio]</text></g><!--link EnCurso to Expirada--><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" data-link-type="dependency" data-source-line="17" id="lnk10"><path d="M509.57,247.4583 C543.68,264.4883 592.39,293.7983 621.04,333.2883 C665.46,394.4883 658.27,421.6783 669.04,496.5283 C672.02,517.1983 680.44,526.0183 669.04,543.5283 C650.97,571.2883 619.8885,583.7392 591.6785,590.3392" fill="none" id="EnCurso-to-Expirada" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="586.81,591.4783,596.4846,593.3228,591.6785,590.3392,594.6621,585.5332,586.81,591.4783" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="166.8037" x="666.06" y="428.4766">fechaExpiracion alcanzada</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="99.7598" x="699.582" y="443.7872">sin completarse</text></g><!--link Completa to Expirada--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" data-link-type="dependency" data-source-line="18" id="lnk11"><path d="M289.19,456.3583 C296.26,460.1783 303.73,463.7683 311.04,466.5283 C374.66,490.4983 403.34,460.5683 461.04,496.5283 C483.37,510.4383 480.09,523.4083 497.04,543.5283 C505.44,553.4883 511.66,560.4408 520.23,569.5808" fill="none" id="Completa-to-Expirada" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="523.65,573.2283,520.412,563.9269,520.23,569.5808,514.5761,569.3989,523.65,573.2283" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="166.8037" x="498.04" y="517.5966">fechaExpiracion alcanzada</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="82.0371" x="540.4233" y="532.9072">sin canjearse</text></g><!--link Canjeada to *end*--><g class="link" data-entity-1="ent0003" data-entity-2="ent0012" data-link-type="dependency" data-source-line="20" id="lnk13"><path d="M251.65,621.9283 C277.79,637.3083 311.15,659.4183 336.04,684.5283 C345.96,694.5283 352.0328,704.1449 356.9828,713.2549" fill="none" id="Canjeada-to-*end*" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="359.37,717.6483,358.5878,707.8305,356.9828,713.2549,351.5584,711.65,359.37,717.6483" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Expirada to *end*--><g class="link" data-entity-1="ent0004" data-entity-2="ent0012" data-link-type="dependency" data-source-line="21" id="lnk14"><path d="M507.09,614.9983 C473.63,629.3783 426.04,653.2583 392.04,684.5283 C381.68,694.0583 375.631,703.7492 370.831,713.0092" fill="none" id="Expirada-