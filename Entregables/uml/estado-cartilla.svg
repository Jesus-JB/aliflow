<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:1162px;height:833px;background:#FFFFFF;" width="1162px" height="833px" viewBox="0 0 1162 833" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7beta11?><defs><filter id="b1wzvmqfeqf9340" x="0" y="0" width="1" height="1"><feFlood flood-color="#FFF3B0" result="flood"/><feComposite in="SourceGraphic" in2="flood" operator="over"/></filter></defs><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="408.197" y="22.995" fill="#000" font-size="14" textLength="338.885" font-weight="700">Diagrama de Estado — Cartilla de fidelidad</text></g><g class="legend" data-source-line="8"><rect x="12" y="49.297" width="458.902" height="26.297" fill="#DDD" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="17" y="67.292" fill="#000" font-size="14" textLength="8.9" filter="url(#b1wzvmqfeqf9340)">  </text><text x="30.351" y="67.292" fill="#000" font-size="14" textLength="435.552">= propuesta de Ingeniería, pendiente de validar con Negocios</text></g><g class="entity" data-qualified-name="EnCurso" id="ent0001" data-source-line="12"><rect x="430.81" y="254.694" width="77.982" height="50" fill="#FFF3B0" style="stroke:#8A6D00;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="430.81" y1="280.991" x2="508.792" y2="280.991" style="stroke:#8A6D00;stroke-width:0.5;"/><text x="440.81" y="272.689" fill="#000" font-size="14" textLength="57.982">EnCurso</text></g><g class="entity" data-qualified-name="Completa" id="ent0002" data-source-line="13"><rect x="200.09" y="455.054" width="87.437" height="50" fill="#FFF3B0" style="stroke:#8A6D00;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="200.09" y1="481.351" x2="287.527" y2="481.351" style="stroke:#8A6D00;stroke-width:0.5;"/><text x="210.09" y="473.049" fill="#000" font-size="14" textLength="67.437">Completa</text></g><g class="entity" data-qualified-name="Canjeada" id="ent0003" data-source-line="14"><rect x="152.92" y="622.324" width="85.775" height="50" fill="#FFF3B0" style="stroke:#8A6D00;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="152.92" y1="648.621" x2="238.695" y2="648.621" style="stroke:#8A6D00;stroke-width:0.5;"/><text x="162.92" y="640.319" fill="#000" font-size="14" textLength="65.775">Canjeada</text></g><g class="entity" data-qualified-name="Expirada" id="ent0004" data-source-line="15"><rect x="477.95" y="622.324" width="81.708" height="50" fill="#FFF3B0" style="stroke:#8A6D00;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="477.95" y1="648.621" x2="559.658" y2="648.621" style="stroke:#8A6D00;stroke-width:0.5;"/><text x="487.95" y="640.319" fill="#000" font-size="14" textLength="61.708">Expirada</text></g><g class="start_entity" data-qualified-name=".start." id="ent0005" data-source-line="17"><ellipse cx="469.8" cy="104.594" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="end_entity" data-qualified-name=".end." id="ent0012" data-source-line="28"><ellipse cx="387.8" cy="776.154" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="387.8" cy="776.154" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN15" id="ent0016" data-source-line="32"><path d="M828.32,206.594 L828.32,275.694 L509.26,279.694 L828.32,283.694 L828.32,352.789 A0,0 0 0 0 828.32,352.789 L1147.279,352.789 A0,0 0 0 0 1147.279,352.789 L1147.279,216.594 L1137.279,206.594 L828.32,206.594 A0,0 0 0 0 828.32,206.594" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1137.279,206.594 L1137.279,216.594 L1147.279,216.594 L1137.279,206.594" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="834.32" y="223.661" fill="#000" font-size="13" textLength="287.854">El sello se acredita en `marcarEntregado()`,</text><text x="834.32" y="238.793" fill="#000" font-size="13" textLength="18.186" font-weight="700">no</text><text x="856.638" y="238.793" fill="#000" font-size="13" textLength="232.496">en `confirmarCompra()`: una orden</text><text x="834.32" y="253.926" fill="#000" font-size="13" textLength="297.959">comprada y nunca retirada no suma. Además</text><text x="834.32" y="269.059" fill="#000" font-size="13" textLength="237.726">`Sello → Orden` es único, así que un</text><text x="834.32" y="284.192" fill="#000" font-size="13" textLength="285.816">reintento de entrega no acredita dos veces.</text><text x="834.32" y="299.325" fill="#000" font-size="13"> </text><text x="834.32" y="314.458" fill="#000" font-size="13" textLength="260.133">`maxSellosPorDia` (por defecto 1) evita</text><text x="834.32" y="329.59" fill="#000" font-size="13" textLength="264.577">que se llene la cartilla comprando varias</text><text x="834.32" y="344.723" fill="#000" font-size="13" textLength="129.245">veces el mismo día.</text></g><g class="entity" data-qualified-name="GMN18" id="ent0019" data-source-line="44"><path d="M322.17,444.784 L322.17,476.054 L287.83,480.054 L322.17,484.054 L322.17,515.315 A0,0 0 0 0 322.17,515.315 L625.438,515.315 A0,0 0 0 0 625.438,515.315 L625.438,454.784 L615.438,444.784 L322.17,444.784 A0,0 0 0 0 322.17,444.784" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M615.438,444.784 L615.438,454.784 L625.438,454.784 L615.438,444.784" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="328.17" y="461.851" fill="#000" font-size="13" textLength="282.268">El canje se aplica sobre una Orden real con</text><text x="328.17" y="476.983" fill="#000" font-size="13" textLength="277.228">`esCanje = true` y total $0 — el plato sale</text><text x="328.17" y="492.116" fill="#000" font-size="13" textLength="259.67">del inventario igual y el ERP del local se</text><text x="328.17" y="507.249" fill="#000" font-size="13" textLength="82.589">entera igual.</text></g><g class="entity" data-qualified-name="GMN21" id="ent0022" data-source-line="51"><path d="M6,733.324 L6,818.988 A0,0 0 0 0 6,818.988 L341.609,818.988 A0,0 0 0 0 341.609,818.988 L341.609,743.324 L331.609,733.324 L185.11,733.324 L191.56,672.774 L177.11,733.324 L6,733.324 A0,0 0 0 0 6,733.324" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M331.609,733.324 L331.609,743.324 L341.609,743.324 L331.609,733.324" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="12" y="750.391" fill="#000" font-size="13" textLength="269.61">Cuando una cartilla se cierra (Canjeada o</text><text x="12" y="765.523" fill="#000" font-size="13" textLength="282.89">Expirada), la siguiente entrega en ese local</text><text x="12" y="780.656" fill="#000" font-size="13" textLength="257.137">emite una cartilla nueva en EnCurso. El</text><text x="12" y="795.789" fill="#000" font-size="13" textLength="106.349">estudiante tiene</text><text x="122.481" y="795.789" fill="#000" font-size="13" textLength="199.996" font-weight="700">una cartilla activa por local</text><text x="322.477" y="795.789" fill="#000" font-size="13">,</text><text x="12" y="810.922" fill="#000" font-size="13" textLength="123.119">no una sola global.</text></g><g class="entity" data-qualified-name="GMN24" id="ent0025" data-source-line="59"><path d="M434.1,733.324 L434.1,818.988 A0,0 0 0 0 434.1,818.988 L731.509,818.988 A0,0 0 0 0 731.509,818.988 L731.509,743.324 L721.509,733.324 L565.55,733.324 L531.14,672.774 L557.55,733.324 L434.1,733.324 A0,0 0 0 0 434.1,733.324" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M721.509,733.324 L721.509,743.324 L731.509,743.324 L721.509,733.324" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="440.1" y="750.391" fill="#000" font-size="13" textLength="235.212" filter="url(#b1wzvmqfeqf9340)">`vigenciaCartillaDias` es propuesta.</text><text x="440.1" y="765.523" fill="#000" font-size="13" textLength="276.409">Negocios no definió si una cartilla a medio</text><text x="440.1" y="780.656" fill="#000" font-size="13" textLength="259.073">llenar caduca. Si decide que no caduca,</text><text x="440.1" y="795.789" fill="#000" font-size="13" textLength="250.11">basta con dejar el campo en nulo — el</text><text x="440.1" y="810.922" fill="#000" font-size="13" textLength="124.63">modelo no cambia.</text></g><!--link *start* to EnCurso--><g class="link" data-entity-1="ent0005" data-entity-2="ent0001" id="lnk6" data-source-line="17" data-link-type="dependency"><path d="M469.8,114.904 C469.8,140.954 469.8,210.254 469.8,249.194" style="stroke:#181818;stroke-width:1;" fill="none" id="*start*-to-EnCurso"/><polygon points="469.8,254.194,473.8,245.194,469.8,249.194,465.8,245.194,469.8,254.194" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="487.809" y="157.661" fill="#000" font-size="13" textLength="164.03">emitirCartilla(estudiante)</text><text x="470.8" y="172.793" fill="#000" font-size="13" textLength="198.047">[primera entrega en ese local]</text></g><!--link EnCurso to EnCurso--><g class="link" data-entity-1="ent0001" data-entity-2="ent0001" id="lnk7" data-source-line="19" data-link-type="dependency"><path d="M509.01,257.854 C527.53,255.314 543.8,262.594 543.8,279.694 C543.8,296.784 532.484,304.741 513.964,302.211" style="stroke:#181818;stroke-width:1;" fill="none" id="EnCurso-to-EnCurso"/><polygon points="509.01,301.534,517.386,306.715,513.964,302.211,518.469,298.789,509.01,301.534" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="608.725" y="276.761" fill="#000" font-size="13" textLength="138.087">acreditarSello(orden)</text><text x="549.8" y="291.893" fill="#000" font-size="13" textLength="255.938">[sellosAcumulados &lt; sellosRequeridos]</text></g><!--link EnCurso to Completa--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk8" data-source-line="21" data-link-type="dependency"><path d="M442.09,305.014 C398.6,343.184 318.557,413.435 275.147,451.545" style="stroke:#181818;stroke-width:1;" fill="none" id="EnCurso-to-Completa"/><polygon points="271.39,454.844,280.792,451.912,275.147,451.545,275.514,445.9,271.39,454.844" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="416.172" y="395.851" fill="#000" font-size="13" textLength="138.087">acreditarSello(orden)</text><text x="351.8" y="410.983" fill="#000" font-size="13" textLength="266.83">[sellosAcumulados == sellosRequeridos]</text></g><!--link Completa to Canjeada--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk9" data-source-line="23" data-link-type="dependency"><path d="M217.99,505.484 C208.1,516.584 197.96,530.524 192.8,545.324 C184.09,570.334 185.852,596.046 189.452,616.976" style="stroke:#181818;stroke-width:1;" fill="none" id="Completa-to-Canjeada"/><polygon points="190.3,621.904,192.716,612.356,189.452,616.976,184.832,613.712,190.3,621.904" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="275.402" y="558.391" fill="#000" font-size="13" textLength="96.205">canjear(orden)</text><text x="194.489" y="573.523" fill="#000" font-size="13" textLength="258.032">UPDATE ... WHERE estado='COMPLETA'</text><text x="193.8" y="588.656" fill="#000" font-size="13" textLength="259.41">[Operador valida la entrega del premio]</text></g><!--link EnCurso to Expirada--><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" id="lnk10" data-source-line="25" data-link-type="dependency"><path d="M509.13,296.604 C544.91,313.044 596.6,342.044 626.8,382.784 C671.58,443.204 663.26,470.864 673.8,545.324 C676.73,566.004 685.9,575.294 673.8,592.324 C648.14,628.444 601.431,640.063 564.821,644.043" style="stroke:#181818;stroke-width:1;" fill="none" id="EnCurso-to-Expirada"/><polygon points="559.85,644.584,569.23,647.588,564.821,644.043,568.365,639.634,559.85,644.584" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="670.8" y="477.121" fill="#000" font-size="13" textLength="174.034">fechaExpiracion alcanzada</text><text x="706.036" y="492.253" fill="#000" font-size="13" textLength="103.562">sin completarse</text></g><!--link Completa to Expirada--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk11" data-source-line="26" data-link-type="dependency"><path d="M282.96,505.434 C290.05,509.154 297.51,512.634 304.8,515.324 C369.83,539.254 401.03,505.594 457.8,545.324 C471.9,555.184 491.527,591.135 504.887,617.745" style="stroke:#181818;stroke-width:1;" fill="none" id="Completa-to-Expirada"/><polygon points="507.13,622.214,506.667,612.376,504.887,617.745,499.517,615.965,507.13,622.214" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="491.8" y="565.891" fill="#000" font-size="13" textLength="174.034">fechaExpiracion alcanzada</text><text x="535.916" y="581.023" fill="#000" font-size="13" textLength="85.801">sin canjearse</text></g><!--link Canjeada to *end*--><g class="link" data-entity-1="ent0003" data-entity-2="ent0012" id="lnk13" data-source-line="28" data-link-type="dependency"><path d="M239.09,664.114 C274.1,678.394 323.26,701.974 358.8,733.324 C369.41,742.674 375.697,752.284 380.707,761.474" style="stroke:#181818;stroke-width:1;" fill="none" id="Canjeada-to-*end*"/><polygon points="383.1,765.864,382.304,756.047,380.707,761.474,375.28,759.876,383.1,765.864" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Expirada to *end*--><g class="link" data-entity-1="ent0004" data-entity-2="ent0012" id="lnk14" data-source-line="29" data-link-type="dependency"><path d="M485.13,672.664 C464.22,688.644 437.5,710.704 416.8,733.324 C407.38,743.624 401.139,752.873 395.759,761.713" style="stroke:#181818;stroke-width:1;" fill="none" id="Expirada-to-*end*"/><polygon points="393.16,765.984,401.256,760.375,395.759,761.71