<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="752px" preserveAspectRatio="none" style="width:754px;height:752px;background:#FFFFFF;" version="1.1" viewBox="0 0 754 752" width="754px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs><filter height="1" id="bw4anl4wpdzrx0" width="1" x="0" y="0"><feFlood flood-color="#F1F1F1" result="flood"/><feComposite in="SourceGraphic" in2="flood" operator="over"/></filter></defs><g><g class="title" data-source-line="2"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="212.4678" x="267.7334" y="23.5352">Diagrama de Estado &#8212; Orden</text></g><g class="legend" data-source-line="4"><rect fill="#DDDDDD" height="26.4883" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="328.6982" x="12" y="49.4883"/><text fill="#000000" filter="url(#bw4anl4wpdzrx0)" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="8.8594" x="17" y="68.0234">&#160;&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="305.4092" x="30.2891" y="68.0234">= confirmado en acta / decisi&#243;n de el cliente</text></g><g class="start_entity" data-qualified-name=".start." data-source-line="8" id="ent0001"><ellipse cx="425.32" cy="104.9766" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/></g><g class="entity" data-qualified-name="COMPRADO" data-source-line="8" id="ent0002"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="100.2334" x="375.21" y="255.5666"/><line style="stroke:#181818;stroke-width:0.5;" x1="375.21" x2="475.4434" y1="282.0548" y2="282.0548"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="80.2334" x="385.21" y="274.1017">COMPRADO</text></g><g class="entity" data-qualified-name="ENTREGADO" data-source-line="10" id="ent0004"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="104.3623" x="574.14" y="525.6666"/><line style="stroke:#181818;stroke-width:0.5;" x1="574.14" x2="678.5023" y1="552.1548" y2="552.1548"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="84.3623" x="584.14" y="544.2017">ENTREGADO</text></g><g class="entity" data-qualified-name="EXPIRADO" data-source-line="12" id="ent0006"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="87.9971" x="118.32" y="525.6666"/><line style="stroke:#181818;stroke-width:0.5;" x1="118.32" x2="206.3171" y1="552.1548" y2="552.1548"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="67.9971" x="128.32" y="544.2017">EXPIRADO</text></g><g class="end_entity" data-qualified-name=".end." data-source-line="14" id="ent0008"><ellipse cx="393.32" cy="727.1866" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="393.32" cy="727.1866" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN11" data-source-line="18" id="ent0012"><path d="M241.44,446.1466 L241.44,546.6666 L206.41,550.6666 L241.44,554.6666 L241.44,655.1837 A0,0 0 0 0 241.44,655.1837 L539.2105,655.1837 A0,0 0 0 0 539.2105,655.1837 L539.2105,456.1466 L529.2105,446.1466 L241.44,446.1466 A0,0 0 0 0 241.44,446.1466" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M529.2105,446.1466 L529.2105,456.1466 L539.2105,456.1466 L529.2105,446.1466" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="132.8247" x="247.44" y="463.7149">Regla cerrada &#167;6.2).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="14.1108" x="247.44" y="479.0255">La</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="259.854" x="247.44" y="494.336">Orden pasa a EXPIRADO cuando vence su</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="276.7705" x="247.44" y="509.6466">CodigoRetiro, y este vence como m&#225;ximo al</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="229.2646" x="247.44" y="524.9571">terminar el mismo d&#237;a de la compra.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="199.8306" x="247.44" y="540.2677">Ver estado-codigo-retiro.puml.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="247.44" y="555.5782">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="273.4253" x="247.44" y="570.8888">Lo &#250;nico que sigue abierto es qu&#233; pasa con</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="11.0005" x="247.44" y="586.1993">el</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="43.2085" x="262.5538" y="586.1993">dinero</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="182.5713" x="305.7623" y="586.1993">: si se reembolsa al saldo del</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="257.5308" x="247.44" y="601.5098">estudiante, si se pierde, o si se le liquida</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="259.6636" x="247.44" y="616.8204">igual al proveedor porque el almuerzo se</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="266.4365" x="247.44" y="632.1309">prepar&#243;. El acta define la expiraci&#243;n, no la</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="140.3848" x="247.44" y="647.4415">pol&#237;tica de reembolso.</text></g><g class="entity" data-qualified-name="GMN14" data-source-line="34" id="ent0015"><path d="M6,221.9766 L6,339.1504 A0,0 0 0 0 6,339.1504 L340.644,339.1504 A0,0 0 0 0 340.644,339.1504 L340.644,284.5666 L374.73,280.5666 L340.644,276.5666 L340.644,231.9766 L330.644,221.9766 L6,221.9766 A0,0 0 0 0 6,221.9766" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M330.644,221.9766 L330.644,231.9766 L340.644,231.9766 L330.644,221.9766" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="82.894" x="12" y="239.5449">Cambio del :</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="97.8428" x="99.0073" y="239.5449">la validaci&#243;n de</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="276.1992" x="12" y="254.8555">disponibilidad ya no se hace contra el stock</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="135.5986" x="12" y="270.166">del ERP sino contra el</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="138.9438" x="151.7119" y="270.166">inventario reservado</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="313.644" x="12" y="285.4766">para Aliflow (`InventarioReservado.disponible()`).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="259.835" x="12" y="300.7871">El local aparta un cupo exclusivo, as&#237; que</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="275.6914" x="12" y="316.0977">Aliflow no compite con la caja por la misma</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="221.8633" x="12" y="331.4082">unidad. Ver diagrama-clases.puml.</text></g><!--link *start* to COMPRADO--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="8" id="lnk3"><path d="M425.32,115.3066 C425.32,141.5066 425.32,211.3466 425.32,250.3166" fill="none" id="*start*-to-COMPRADO" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="425.32,255.3166,429.32,246.3166,425.32,250.3166,421.32,246.3166,425.32,255.3166" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="119.4565" x="470.03" y="158.5449">confirmarCompra()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="206.8765" x="426.32" y="173.8555">(saldo validado y cupo reservado</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="140.3721" x="459.5722" y="189.166">de Aliflow consumido)</text></g><!--link COMPRADO to ENTREGADO--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" data-link-type="dependency" data-source-line="10" id="lnk5"><path d="M445.68,305.9166 C471.98,337.6366 518.82,395.0766 556.32,446.1466 C575.84,472.7266 594.1272,500.0495 607.9772,521.2695" fill="none" id="COMPRADO-to-ENTREGADO" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="610.71,525.4566,609.1405,515.7336,607.9772,521.2695,602.4412,520.1061,610.71,525.4566" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="173.6338" x="549.2254" y="390.2149">marcarEntregado(operador)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="205.7847" x="533.15" y="405.5255">[CodigoRetiro v&#225;lido y no usado]</text></g><!--link COMPRADO to EXPIRADO--><g class="link" data-entity-1="ent0002" data-entity-2="ent0006" data-link-type="dependency" data-source-line="12" id="lnk7"><path d="M398.61,305.9366 C386.6,316.5266 372.06,328.8366 358.32,339.1466 C338.8,353.8066 331.78,354.4066 312.32,369.1466 C270.9,400.5366 257.63,406.2566 224.32,446.1466 C203.64,470.9066 187.6938,498.8986 176.4438,520.8086" fill="none" id="COMPRADO-to-EXPIRADO" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="174.16,525.2566,181.8293,519.0774,176.4438,520.8086,174.7126,515.4232,174.16,525.2566" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="53.4282" x="375.6603" y="382.7149">expirar()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="178.1089" x="313.32" y="398.0255">[termin&#243; el d&#237;a de la compra</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="176.2427" x="314.2531" y="413.336">o venci&#243; horaMaximaRetiro]</text></g><!--link ENTREGADO to *end*--><g class="link" data-entity-1="ent0004" data-entity-2="ent0008" data-link-type="dependency" data-source-line="14" id="lnk9"><path d="M614.99,575.9266 C603.17,598.9766 582.68,633.2766 556.32,655.1866 C507.42,695.8366 436.5389,715.8573 408.8089,722.5873" fill="none" id="ENTREGADO-to-*end*" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="403.95,723.7666,413.6395,725.5311,408.8089,722.5873,411.7527,717.7567,403.95,723.7666" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link EXPIRADO to *end*--><g class="link" data-entity-1="ent0006" data-entity-2="ent0008" da