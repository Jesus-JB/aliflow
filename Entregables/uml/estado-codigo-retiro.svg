<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="904px" preserveAspectRatio="none" style="width:706px;height:904px;background:#FFFFFF;" version="1.1" viewBox="0 0 706 904" width="706px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs><filter height="1" id="b1wcg31xz180ld0" width="1" x="0" y="0"><feFlood flood-color="#F1F1F1" result="flood"/><feComposite in="SourceGraphic" in2="flood" operator="over"/></filter></defs><g><g class="title" data-source-line="2"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="262.2197" x="218.5701" y="23.5352">Diagrama de Estado &#8212; CodigoRetiro</text></g><g class="legend" data-source-line="4"><rect fill="#DDDDDD" height="26.4883" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="328.6982" x="12" y="49.4883"/><text fill="#000000" filter="url(#b1wcg31xz180ld0)" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="8.8594" x="17" y="68.0234">&#160;&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="305.4092" x="30.2891" y="68.0234">= confirmado en acta / decisi&#243;n de el cliente</text></g><g class="start_entity" data-qualified-name=".start." data-source-line="8" id="ent0001"><ellipse cx="385.78" cy="104.9766" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/></g><g class="entity" data-qualified-name="Valido" data-source-line="8" id="ent0002"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="62.3896" x="354.58" y="279.2166"/><line style="stroke:#181818;stroke-width:0.5;" x1="354.58" x2="416.9696" y1="305.7048" y2="305.7048"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="42.3896" x="364.58" y="297.7517">Valido</text></g><g class="entity" data-qualified-name="Utilizado" data-source-line="10" id="ent0004"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="80.2451" x="218.65" y="477.4566"/><line style="stroke:#181818;stroke-width:0.5;" x1="218.65" x2="298.8951" y1="503.9448" y2="503.9448"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="60.2451" x="228.65" y="495.9917">Utilizado</text></g><g class="entity" data-qualified-name="Vencido" data-source-line="12" id="ent0006"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="74.2705" x="478.64" y="477.4566"/><line style="stroke:#181818;stroke-width:0.5;" x1="478.64" x2="552.9105" y1="503.9448" y2="503.9448"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="54.2705" x="488.64" y="495.9917">Vencido</text></g><g class="end_entity" data-qualified-name=".end." data-source-line="14" id="ent0008"><ellipse cx="294.78" cy="738.9066" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="294.78" cy="738.9066" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN11" data-source-line="18" id="ent0012"><path d="M452.45,260.9366 L452.45,300.2166 L417.24,304.2166 L452.45,308.2166 L452.45,347.4893 A0,0 0 0 0 452.45,347.4893 L677.1019,347.4893 A0,0 0 0 0 677.1019,347.4893 L677.1019,270.9366 L667.1019,260.9366 L452.45,260.9366 A0,0 0 0 0 452.45,260.9366" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M667.1019,260.9366 L667.1019,270.9366 L677.1019,270.9366 L667.1019,260.9366" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="190.1187" x="458.45" y="278.5049">La actualizaci&#243;n a Utilizado es</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="202.8838" x="458.45" y="293.8155">at&#243;mica y condicional &#8212; evita la</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="189.7759" x="458.45" y="309.126">doble redenci&#243;n (riesgo R-14,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="185.7134" x="458.45" y="324.4366">ver Gestion-de-Riesgos.md y</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="203.6519" x="458.45" y="339.7471">secuencia-retiro-entrega.puml).</text></g><g class="entity" data-qualified-name="GMN14" data-source-line="26" id="ent0015"><path d="M6,237.9766 L6,370.4609 A0,0 0 0 0 6,370.4609 L319.5508,370.4609 A0,0 0 0 0 319.5508,370.4609 L319.5508,308.2166 L354.18,304.2166 L319.5508,300.2166 L319.5508,247.9766 L309.5508,237.9766 L6,237.9766 A0,0 0 0 0 6,237.9766" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M309.5508,237.9766 L309.5508,247.9766 L319.5508,247.9766 L309.5508,237.9766" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="221.2666" x="12" y="255.5449">Formato (decisi&#243;n de el cliente, ):</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="42.6753" x="12" y="270.8555">c&#243;digo</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="185.8721" x="58.7886" y="270.8555">num&#233;rico corto de 6 d&#237;gitos</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="59.8901" x="244.6606" y="270.8555">, no UUID</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="289.8594" x="12" y="286.166">ni QR &#8212; el estudiante se lo dice de viva voz al</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="226.9922" x="12" y="301.4766">Operador y este lo digita en Aliflow.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="271.7114" x="12" y="316.7871">La unicidad se exige solo entre los c&#243;digos</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="159.1738" x="12" y="332.0977">V&#225;lidos del mismo local</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="83.3003" x="171.1738" y="332.0977">, no global ni</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="277.3735" x="12" y="347.4082">hist&#243;rica, y se reintenta la generaci&#243;n si hay</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="52.7109" x="12" y="362.7188">colisi&#243;n.</text></g><g class="entity" data-qualified-name="GMN17" data-source-line="37" id="ent0018"><path d="M343.74,588.4566 L343.74,889.357 A0,0 0 0 0 343.74,889.357 L687.804,889.357 A0,0 0 0 0 687.804,889.357 L687.804,598.4566 L677.804,588.4566 L519.78,588.4566 L515.78,527.6666 L511.78,588.4566 L343.74,588.4566 A0,0 0 0 0 343.74,588.4566" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M677.804,588.4566 L677.804,598.4566 L687.804,598.4566 L677.804,588.4566" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="172.7642" x="349.74" y="606.0249">Regla de expiraci&#243;n &#167;6.2):</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="315.1484" x="349.74" y="621.3355">el c&#243;digo vale **&#250;nicamente durante el d&#237;a en que</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="292.9316" x="349.74" y="636.646">se hizo la compra**. Si se presenta otro d&#237;a, el</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="310.0386" x="349.74" y="651.9566">sistema debe mostrarlo como vencido o inv&#225;lido.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="323.064" x="349.74" y="667.2671">La vigencia termina, como m&#225;ximo, al terminar ese</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="69.9893" x="349.74" y="682.5777">mismo d&#237;a.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="349.74" y="697.8882">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="26.5205" x="349.74" y="713.1988">Esto</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="54.3804" x="380.3738" y="713.1988">cierra la</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="124.9409" x="434.7542" y="713.1988">, que estaba abierta</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="276.9102" x="349.74" y="728.5093">desde el 27-jul, y refuerza la mitigaci&#243;n del</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="295.0073" x="349.74" y="743.8198">riesgo R-15: acotar la vigencia a un d&#237;a reduce</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="318.3857" x="349.74" y="759.1304">dr&#225;sticamente el universo de c&#243;digos vigentes a la</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="314.4248" x="349.74" y="774.4409">vez, que es lo que hace viable usar solo 6 d&#237;gitos.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="349.74" y="789.7515">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="318.5635" x="349.74" y="805.062">Dispara adem&#225;s la transici&#243;n de la Orden asociada</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="245.832" x="349.74" y="820.3726">a EXPIRADO &#8212; ver estado-orden.puml.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="349.74" y="835.6831">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="236.0186" x="349.74" y="850.9937">Lo que sigue abierto: qu&#233; pasa con el</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="43.2085" x="589.8718" y="850.9937">dinero</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="318.4111" x="349.74" y="866.3042">de una orden vencida. El acta define cu&#225;ndo vence</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="197.4248" x="349.74" y="881.6148">el c&#243;digo, no si hay reembolso.</text></g><!--link *start* to Valido--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="8" id="lnk3"><path d="M385.78,115.2166 C385.78,144.3866 385.78,230.1166 385.78,273.9766" fill="none" id="*start*-to-Valido" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="385.78,278.9766,389.78,269.9766,385.78,273.9766,381.78,269.9766,385.78,278.9766" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="182.5205" x="428.5603" y="158.5449">generar(6 d&#237;gitos num&#233;ricos)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="266.0811" x="386.78" y="173.8555">fechaExpiracion = min(horaMaximaRetiro,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="153.5244" x="443.0583" y="189.166">fin del d&#237;a de la compra)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="151.3345" x="444.1533" y="204.4766">[al confirmar la compra]</text></g><!--link Valido to Utilizado--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" data-link-type="dependency" data-source-line="10" id="lnk5"><path d="M372.47,329.5066 C363.87,343.2166 351.55,359.6966 336.78,370.4566 C303.71,394.5266 273.52,367.1566 249.78,400.4566 C233.94,422.6766 238.9323,450.2959 246.6323,472.3559" fill="none" id="Valido-to-Utilizado" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="248.28,477.0766,249.0906,467.2611,246.6323,472.3559,241.5375,469.8975,248.28,477.0766" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="129.7144" x="298.0129" y="414.0249">invalidarSiNoUsado()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="224.1802" x="250.78" y="429.3355">UPDATE ... WHERE estado='VALIDO'</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="180.0957" x="272.8222" y="444.646">[Operador confirma entrega]</text></g><!--link Valido to Vencido--><g class="link" data-entity-1="ent0002" data-entity-2="ent0006" data-link-type="dependency" data-source-line="12" id="lnk7"><path d="M401.03,329.4266 C409.92,342.4566 421.91,358.2966 434.78,370.4566 C452.24,386.9666 464.99,381.5066 479.78,400.4566 C497.53,423.2066 505.932,450.5476 510.622,472.4276" fill="none" id="Valido-to-Vencido" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="511.67,477.3166,513.6948,467.6781,510.622,472.4276,505.8725,469.3548,511.67,477.3166" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="163.4204" x="515.6598" y="421.5249">venci&#243; el horario de retiro</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="185.98" x="504.38" y="436.8355">o termin&#243; el d&#237;a de la compra</text></g><!--link Utilizado to *end*--><g class="link" data-entity-1="ent0004" data-entity-2="ent0008" data-link-type="dependency" data-source-line="14" id="lnk9"><path d="M262.49,527.6666 C270.25,578.2066 287.1405,688.1946 292.4705,722.8746" fill="none" id="Utilizado-to-*end*" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="293.23,727.8166,295.8164,718.3134,292.4705,722.8746,287.9093,719.5286,293.23,727.8166" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Vencido to *end*--><g class="link" data-entity-1="ent0006" data-entity-2="ent0008" data-link-type="dependency" data-source-line="15" id="lnk10"><path d="M478.51,509.6666 C435.01,518.9366 364.16,540.7266 325.78,588.4566 C291.73,630.7866 292.029,696.1656 293.619,722.5256" fill="none" id="Vencido-to-*end*" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="293.92,727.5166,297.3709,718.2921,293.619,722.5256,289.3854,718.7737,293.92,727.5166" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><?plantuml-src TLN1RXit4BtlLmpGG-o5j462DWMCne1HAQq1jqwLsYsGv40jgTMqtALASbLRftv4Vy2d8eUUVEkn-oVzahuXLrRIe31WIBkScVVUl4T5ZjRGZ5NZLQj86vg7gBIZVtxxdRvqcXktC96zAmfh6jDfYcv3rgnYGVJ5KjK_dtpouedydUBxOtbmIi-fTjsAVIkDJ4UgZeeUetdDWOVxJiOOIxLbqqLJe6lkNHIloxSqdPxIjRACsXF2O-ELFtf6UlYpuUW2TNqxlFDSkt3yfbkPUgtcDnlsgcRNONJBtT7QUVMDkk5MPV0J76GPQwLDecaLGBO