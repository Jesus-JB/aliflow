name: Integración continua de la aplicación

# Cada push o PR que toque la aplicación corre las pruebas del backend contra
# PostgreSQL real, las pruebas de restricciones del esquema, y el lint y la
# compilación del frontend. Si algo falla, no se integra.
on:
  push:
    branches: [main]
    paths: ['app/**', 'Entregables/markdown/04-Modelo-de-Base-de-Datos/**', '.github/workflows/ci-app.yml']
  pull_request:
    paths: ['app/**', 'Entregables/markdown/04-Modelo-de-Base-de-Datos/**', '.github/workflows/ci-app.yml']

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aliflow
          POSTGRES_PASSWORD: aliflow
          POSTGRES_DB: aliflow_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aliflow" --health-interval 2s --health-retries 15
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Pruebas (criterios de aceptación del sprint)
        run: pytest
        env:
          ALIFLOW_TEST_DATABASE_URL: postgresql+psycopg://aliflow:aliflow@localhost:5432/aliflow_test
      - name: Pruebas de restricciones del esquema (entregable 04)
        run: |
          PGPASSWORD=aliflow createdb -h localhost -U aliflow aliflow_restricciones
          scripts/probar-restricciones.sh postgresql://aliflow:aliflow@localhost:5432/aliflow_restricciones

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx tsc --noEmit
